[project]
name = "crafty-cad"
version = "0.1.0"
description = "File-based FreeCAD evaluation, rendering, and verification for Crafty."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "rich>=15.0.0",
]
